<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Weather Dashboard</h1>
    <p class="intro">Live conditions for any city in the world.</p>

    <form id="search-form" class="search">
      <label for="city-input" class="visually-hidden">City name</label>
      <input id="city-input" type="text" placeholder="e.g. Beirut, Tokyo, Bratislava" autocomplete="off">
      <button id="search-btn" type="submit">Search</button>
    </form>

    <div class="status-row">
      <p id="status" data-state="idle">Search for a city.</p>
      <button id="retry-btn" type="button" hidden>Retry</button>
    </div>

    <section id="weather" class="weather" hidden>
      <h2 id="place"></h2>
      <p id="updated" class="muted"></p>

      <div class="now">
        <span id="icon" class="icon" role="img"></span>
        <div>
          <p id="temp" class="temp"></p>
          <p id="condition"></p>
        </div>
      </div>

      <ul class="details">
        <li>Feels like <strong id="feels"></strong></li>
        <li>Humidity <strong id="humidity"></strong></li>
        <li>Wind <strong id="wind"></strong></li>
      </ul>

      <h3>Next 3 days</h3>
      <ul id="forecast" class="forecast"></ul>
    </section>
  </main>

  <!-- Modules need a local server (Live Server) — they are blocked on file:// -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
